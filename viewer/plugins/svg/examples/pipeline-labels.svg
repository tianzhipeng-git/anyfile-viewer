<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="200" viewBox="0 0 320 200">
  <title>Release pipeline</title>
  <desc>Three build stages with a legend and an embedded thumbnail.</desc>
  <style>text { font-family: sans-serif; font-size: 12px; }</style>
  <g id="stages">
    <rect x="10" y="40" width="90" height="40" rx="6" fill="#dbeafe"/>
    <text x="55" y="64" text-anchor="middle">Build</text>
    <rect x="115" y="40" width="90" height="40" rx="6" fill="#dcfce7"/>
    <text x="160" y="64" text-anchor="middle">Test 测试</text>
    <rect x="220" y="40" width="90" height="40" rx="6" fill="#fef9c3"/>
    <text x="265" y="64" text-anchor="middle">Deploy</text>
    <path d="M100 60 H115 M205 60 H220" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="10" y="120"><tspan x="10" dy="0">Legend:</tspan><tspan x="10" dy="16">blue = compile</tspan><tspan x="10" dy="16">green = verify</tspan></text>
  <image x="270" y="140" width="40" height="40" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAbUlEQVR42hXOUREAUQhCUaMYhShEMcqNQhSi7Fs/OQzjzLCDBg83MGToMLPsosXLLSxZug/ECgmLE4iI6oFZI2NzBhNTPzj20OHjDo4cvQf/7Bt41Rf+F+h7YsIGBYfLHyc0D8oWFZfrX05p+QDeqGABtJu0bQAAAABJRU5ErkJggg=="/>
</svg>
